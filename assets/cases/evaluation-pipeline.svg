<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">评测流水线：先定义标准，再核事实与偏好</title><desc id="desc">任务信息用于生成独立Rubric，事实核查提供证据。冻结的标准和事实结论送入AB与BA双向Judge，汇总稳定性指标，低置信样本进入人工复核。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b8daf" stroke-width="1.5"/></marker></defs><rect width="1000" height="650" rx="18" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="22" font-weight="600" fill="#1d1d1f">评测流水线：先定义标准，再核事实与偏好</text><path d="M320 134H360" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M640 134H680" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M820 174V212H500V260" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M180 174V260" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M320 302H360" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M640 302H680" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M820 344V432" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M680 474H640" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M360 474H320" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="94" width="280" height="80" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="180.0" y="130.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">任务与可信上下文</text><text x="180.0" y="156.0" text-anchor="middle" font-size="14" fill="#62626b">Query / History / 任务约束</text><rect x="360" y="94" width="280" height="80" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="500.0" y="130.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">Rubric Agent</text><text x="500.0" y="156.0" text-anchor="middle" font-size="14" fill="#62626b">原子化标准，不看候选答案</text><rect x="680" y="94" width="280" height="80" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="820.0" y="130.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">Rubric 校验</text><text x="820.0" y="156.0" text-anchor="middle" font-size="14" fill="#62626b">覆盖、可验证、非冗余</text><rect x="40" y="260" width="280" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="180.0" y="298.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">事实核查</text><text x="180.0" y="324.0" text-anchor="middle" font-size="14" fill="#62626b">Claim → 证据 → 结论</text><rect x="360" y="260" width="280" height="84" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="500.0" y="298.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">冻结评测输入</text><text x="500.0" y="324.0" text-anchor="middle" font-size="14" fill="#62626b">Rubric + 事实证据 + 回答</text><rect x="680" y="260" width="280" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="820.0" y="298.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">AB / BA Judge</text><text x="820.0" y="324.0" text-anchor="middle" font-size="14" fill="#62626b">交换顺序，映射回真实回答</text><rect x="680" y="432" width="280" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="820.0" y="470.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">聚合与诊断报告</text><text x="820.0" y="496.0" text-anchor="middle" font-size="14" fill="#62626b">分差、稳定性、错误类型</text><rect x="360" y="432" width="280" height="84" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="500.0" y="470.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">低置信与冲突复核</text><text x="500.0" y="496.0" text-anchor="middle" font-size="14" fill="#62626b">事实不足 / 位置敏感 / 分歧</text><rect x="40" y="432" width="280" height="84" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="180.0" y="470.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">版本回归</text><text x="180.0" y="496.0" text-anchor="middle" font-size="14" fill="#62626b">记录改动，检验修复与退化</text><text x="40" y="578" font-size="14" fill="#62626b">事实核查与 Rubric 生成可以并行；主 Judge 依据冻结的标准与证据评价。</text></g></svg>