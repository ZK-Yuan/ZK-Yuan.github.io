<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc"><title id="title">记忆胶囊：Read → Process → Write</title><desc id="desc">在Python沙盒无法直连Redis、同步引擎无法后台归档的限制下，通过外部节点读取记忆，Python组装上下文，再写回。短对话走滑窗，长对话在下一轮前置归档。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b8daf" stroke-width="1.5"/></marker></defs><rect width="1000" height="600" rx="18" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="22" font-weight="600" fill="#1d1d1f">记忆胶囊：Read → Process → Write</text><path d="M300 142H370" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 142H700" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 184V240H350V295" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M500 240H700V295" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M350 383V430H500V475" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700 383V430H500" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="100" width="260" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="170.0" y="138.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">READ · 读取</text><text x="170.0" y="164.0" text-anchor="middle" font-size="14" fill="#62626b">Redis 会话与短期记忆</text><rect x="370" y="100" width="260" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="500.0" y="138.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">PROCESS · 处理</text><text x="500.0" y="164.0" text-anchor="middle" font-size="14" fill="#62626b">Python 清洗、校验、组装</text><rect x="700" y="100" width="260" height="84" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="830.0" y="138.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">WRITE · 写回</text><text x="830.0" y="164.0" text-anchor="middle" font-size="14" fill="#62626b">更新状态与对话记录</text><rect x="220" y="295" width="260" height="88" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="350.0" y="335.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">短对话直通</text><text x="350.0" y="361.0" text-anchor="middle" font-size="14" fill="#62626b">滑动窗口，控制上下文长度</text><rect x="570" y="295" width="260" height="88" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="700.0" y="335.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">长对话归档</text><text x="700.0" y="361.0" text-anchor="middle" font-size="14" fill="#62626b">下一轮前置总结，避免同步阻塞</text><rect x="300" y="475" width="400" height="76" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="500.0" y="509.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">Context Assembler</text><text x="500.0" y="535.0" text-anchor="middle" font-size="14" fill="#62626b">按优先级裁剪，遵守 Token 预算</text></g></svg>