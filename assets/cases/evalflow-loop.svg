<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 435" role="img" aria-labelledby="title desc"><title id="title">EvalFlow：从评测集到可行动的诊断</title><desc id="desc">评测集管理进入实验跑批，再通过AB对比和Trace Diff下钻发现差异，生成诊断与修复建议后回归验证。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b8daf" stroke-width="1.5"/></marker></defs><rect width="1000" height="435" rx="18" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="22" font-weight="600" fill="#1d1d1f">EvalFlow：从评测集到可行动的诊断</text><path d="M300 152H370" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M630 152H700" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M830 196V283" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700 327H630" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M370 327H300" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170 283V196" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="108" width="260" height="88" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="170.0" y="148.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">评测集管理</text><text x="170.0" y="174.0" text-anchor="middle" font-size="14" fill="#62626b">数据集与变量映射</text><rect x="370" y="108" width="260" height="88" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="500.0" y="148.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">实验与跑批</text><text x="500.0" y="174.0" text-anchor="middle" font-size="14" fill="#62626b">版本、成本、执行状态</text><rect x="700" y="108" width="260" height="88" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="830.0" y="148.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">A/B 对撞</text><text x="830.0" y="174.0" text-anchor="middle" font-size="14" fill="#62626b">新旧结果与分维度差异</text><rect x="700" y="283" width="260" height="88" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="830.0" y="323.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">Trace Diff</text><text x="830.0" y="349.0" text-anchor="middle" font-size="14" fill="#62626b">节点输入输出与性能信息</text><rect x="370" y="283" width="260" height="88" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="500.0" y="323.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">归因与修复建议</text><text x="500.0" y="349.0" text-anchor="middle" font-size="14" fill="#62626b">技术差异映射到业务问题</text><rect x="40" y="283" width="260" height="88" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="170.0" y="323.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">回归验证</text><text x="170.0" y="349.0" text-anchor="middle" font-size="14" fill="#62626b">确认修复，并防止新退化</text></g></svg>