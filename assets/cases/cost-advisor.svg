<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">成本顾问：把计算与解释分开</title><desc id="desc">价格和能力配置进入确定性Python匹配引擎，筛选与核算后的结果由语言模型解释；价格缺失或口径不一致时不编造估值。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b8daf" stroke-width="1.5"/></marker></defs><rect width="1000" height="310" rx="18" fill="#fff"/><g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif"><text x="36" y="46" font-size="22" font-weight="600" fill="#1d1d1f">成本顾问：把计算与解释分开</text><path d="M320 160H360" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M640 160H680" stroke="#6b8daf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="112" width="280" height="96" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="180.0" y="156.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">数据层</text><text x="180.0" y="182.0" text-anchor="middle" font-size="14" fill="#62626b">价格、能力、计费单位</text><rect x="360" y="112" width="280" height="96" rx="12" fill="#edf5ff" stroke="#b5d7fb"/><text x="500.0" y="156.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0064c7">确定性脚本</text><text x="500.0" y="182.0" text-anchor="middle" font-size="14" fill="#62626b">能力过滤、匹配、成本核算</text><rect x="680" y="112" width="280" height="96" rx="12" fill="#f5f5f7" stroke="#dcdfe5"/><text x="820.0" y="156.0" text-anchor="middle" font-size="18" font-weight="600" fill="#1d1d1f">LLM 总结</text><text x="820.0" y="182.0" text-anchor="middle" font-size="14" fill="#62626b">解释选型理由与降本建议</text><text x="40" y="258" font-size="14" fill="#62626b">模型调用成本 + 服务器 / 存储成本；统一场景与区域后再比较。</text></g></svg>